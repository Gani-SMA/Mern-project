<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211e"/>
      <stop offset="100%" stop-color="#121110"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#aa8232"/>
      <stop offset="100%" stop-color="#8c6a46"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Inner Subtle Inset Frame -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#8c6a46" stroke-width="0.8" opacity="0.4"/>

  <!-- Official Scale of Justice & Monogram -->
  <!-- Central Beam -->
  <line x1="32" y1="14" x2="32" y2="48" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top Finial -->
  <circle cx="32" cy="14" r="2.5" fill="url(#goldGrad)"/>

  <!-- Crossbar -->
  <path d="M18 22 L32 20 L46 22" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Scale Pan -->
  <path d="M18 22 L14 31 L22 31 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M13 31 Q18 35 23 31" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Right Scale Pan -->
  <path d="M46 22 L42 31 L50 31 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M41 31 Q46 35 51 31" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Base Pedestal -->
  <path d="M24 48 L40 48" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M27 45 L37 45" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>